<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif">
  <!-- Metodologia de medição: etapas de scripts/metricas.sh. Fundo transparente, para slide escuro. -->
  <defs>
    <style>
      .titulo { font-size: 21px; font-weight: 700; fill: #ffffff; }
      .corpo  { font-size: 16px; fill: #d6def0; }
      .mono   { font-size: 14px; fill: #d6def0; font-family: Menlo, Consolas, 'Courier New', monospace; }
      .saida  { font-size: 15px; font-weight: 700; }
      .chip   { font-size: 15px; font-weight: 700; fill: #0e1838; }
      .num    { font-size: 15px; font-weight: 700; fill: #0e1838; }
      .nota   { font-size: 14px; fill: #b8c4dd; }
      .card   { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.22; stroke-width: 1.2; }
    </style>
  </defs>

  <text x="20" y="28" class="corpo" font-size="18">Mesmo cenário para os 3 protocolos · laboratório recriado do zero a cada execução · cerca de 7 min por protocolo</text>

  <!-- 1. Subir -->
  <g transform="translate(20,52)">
    <rect class="card" width="228" height="268" rx="12"/>
    <rect width="228" height="6" rx="3" fill="#9fb2d6"/>
    <circle cx="30" cy="40" r="14" fill="#9fb2d6"/><text x="30" y="45" class="num" text-anchor="middle">1</text>
    <text x="54" y="47" class="titulo">Subir</text>
    <text x="16" y="88" class="mono">make metricas</text>
    <text x="16" y="108" class="mono">PROTO=…</text>
    <text x="16" y="138" class="corpo">laboratório do zero:</text>
    <text x="16" y="160" class="corpo">o relógio começa aqui</text>
    <rect x="16" y="196" width="72" height="28" rx="14" fill="#9fb2d6"/><text x="52" y="215" class="chip" text-anchor="middle">~20 s</text>
  </g>

  <!-- 2. Convergência e tabela -->
  <g transform="translate(273,52)">
    <rect class="card" width="228" height="268" rx="12"/>
    <rect width="228" height="6" rx="3" fill="#5fc4b0"/>
    <circle cx="30" cy="40" r="14" fill="#5fc4b0"/><text x="30" y="45" class="num" text-anchor="middle">2</text>
    <text x="54" y="47" class="titulo">Convergência</text>
    <text x="16" y="88" class="corpo">5 roteadores com as</text>
    <text x="16" y="110" class="corpo">9 redes e ha → he</text>
    <text x="16" y="140" class="corpo">+ tamanho da tabela:</text>
    <text x="16" y="162" class="corpo">rotas total e aprendidas</text>
    <rect x="16" y="196" width="96" height="28" rx="14" fill="#5fc4b0"/><text x="64" y="215" class="chip" text-anchor="middle">3 a 52 s</text>
    <text x="16" y="250" class="saida" fill="#5fc4b0">→ s até convergir, rotas</text>
  </g>

  <!-- 3. Tráfego de controle -->
  <g transform="translate(526,52)">
    <rect class="card" width="228" height="268" rx="12"/>
    <rect width="228" height="6" rx="3" fill="#6aa8ff"/>
    <circle cx="30" cy="40" r="14" fill="#6aa8ff"/><text x="30" y="45" class="num" text-anchor="middle">3</text>
    <text x="54" y="47" class="titulo">Controle</text>
    <text x="16" y="88" class="corpo">tcpdump em regime,</text>
    <text x="16" y="110" class="corpo">só o protocolo:</text>
    <text x="16" y="138" class="mono">OSPF</text><text x="112" y="138" class="mono">IP 89</text>
    <text x="16" y="158" class="mono">RIP</text><text x="112" y="158" class="mono">UDP 520</text>
    <text x="16" y="178" class="mono">Gravidade</text><text x="112" y="178" class="mono">UDP 5555</text>
    <rect x="16" y="196" width="72" height="28" rx="14" fill="#6aa8ff"/><text x="52" y="215" class="chip" text-anchor="middle">120 s</text>
    <text x="16" y="250" class="saida" fill="#6aa8ff">→ pacotes/min e bit/s</text>
  </g>

  <!-- 4. Delay -->
  <g transform="translate(779,52)">
    <rect class="card" width="228" height="268" rx="12"/>
    <rect width="228" height="6" rx="3" fill="#c79bff"/>
    <circle cx="30" cy="40" r="14" fill="#c79bff"/><text x="30" y="45" class="num" text-anchor="middle">4</text>
    <text x="54" y="47" class="titulo">Delay</text>
    <text x="16" y="88" class="corpo">20 pings de ha → he</text>
    <text x="16" y="116" class="corpo">traceroute de ha → he</text>
    <rect x="16" y="196" width="72" height="28" rx="14" fill="#c79bff"/><text x="52" y="215" class="chip" text-anchor="middle">~10 s</text>
    <text x="16" y="250" class="saida" fill="#c79bff">→ RTT e saltos</text>
  </g>

  <!-- 5. Falha de enlace -->
  <g transform="translate(1032,52)">
    <rect class="card" width="228" height="268" rx="12"/>
    <rect width="228" height="6" rx="3" fill="#ff8a65"/>
    <circle cx="30" cy="40" r="14" fill="#ff8a65"/><text x="30" y="45" class="num" text-anchor="middle">5</text>
    <text x="54" y="47" class="titulo">Falha</text>
    <text x="16" y="88" class="corpo">ping a cada 0,2 s</text>
    <text x="16" y="110" class="corpo">de ha → he</text>
    <text x="16" y="140" class="corpo">enlace de A no sw1</text>
    <text x="16" y="162" class="corpo">cai aos 10 s</text>
    <rect x="16" y="196" width="72" height="28" rx="14" fill="#ff8a65"/><text x="52" y="215" class="chip" text-anchor="middle">240 s</text>
    <text x="16" y="250" class="saida" fill="#ff8a65">→ s sem resposta, perdas</text>
  </g>

  <!-- setas entre etapas -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 180 l7 6 l-7 6"/>
    <path d="M509 180 l7 6 l-7 6"/>
    <path d="M762 180 l7 6 l-7 6"/>
    <path d="M1015 180 l7 6 l-7 6"/>
  </g>

  <!-- duração real, em escala: 450 s em 1240 px (2,756 px/s); convergência no pior caso (OSPF, 52 s) -->
  <text x="20" y="362" class="nota">duração real, em escala (convergência no pior caso: OSPF)</text>
  <g>
    <rect x="20"    y="374" width="54"  height="18" rx="3" fill="#9fb2d6"/>
    <rect x="76"    y="374" width="141" height="18" rx="3" fill="#5fc4b0"/>
    <rect x="219"   y="374" width="329" height="18" rx="3" fill="#6aa8ff"/>
    <rect x="550"   y="374" width="25"  height="18" rx="3" fill="#c79bff"/>
    <rect x="577"   y="374" width="661" height="18" rx="3" fill="#ff8a65"/>
  </g>
  <!-- queda do enlace aos 10 s da etapa 5 -->
  <line x1="605" y1="366" x2="605" y2="400" stroke="#ffffff" stroke-width="2.5"/>
  <text x="613" y="388" font-size="14" font-weight="700" fill="#0e1838">enlace cai</text>
  <text x="1230" y="388" font-size="14" font-weight="700" fill="#0e1838" text-anchor="end">enlace volta</text>
  <!-- marcas de minuto -->
  <g class="nota" text-anchor="middle" transform="translate(0,418)">
    <text x="20" text-anchor="start">0</text>
    <text x="185">1 min</text>
    <text x="351">2 min</text>
    <text x="516">3 min</text>
    <text x="681">4 min</text>
    <text x="847">5 min</text>
    <text x="1012">6 min</text>
    <text x="1177">7 min</text>
  </g>
  <g stroke="#b8c4dd" stroke-opacity="0.6" stroke-width="1">
    <line x1="185" y1="396" x2="185" y2="402"/><line x1="351" y1="396" x2="351" y2="402"/>
    <line x1="516" y1="396" x2="516" y2="402"/><line x1="681" y1="396" x2="681" y2="402"/>
    <line x1="847" y1="396" x2="847" y2="402"/><line x1="1012" y1="396" x2="1012" y2="402"/>
    <line x1="1177" y1="396" x2="1177" y2="402"/>
  </g>
</svg>
