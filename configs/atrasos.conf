# Atraso de propagação das redes de trânsito no cenário ATRASO=1 (make up ... ATRASO=1).
# Cada roteador aplica o atraso na saída da sua interface naquela rede (tc netem), então o
# RTT entre dois vizinhos é o dobro do valor abaixo. LANs de acesso ficam sem atraso.
#
# Valores de ida em ms, proporcionais à distância: fibra leva cerca de 5 µs por km,
# mais o tempo dos equipamentos no caminho.
#   sw0  1 ms  rede metropolitana, roteadores na mesma cidade (dezenas de km)
#   be   3 ms  fibra regional, cerca de 400 km
#   cd   5 ms  fibra regional, cerca de 700 km
#   sw1 15 ms  enlace de longa distância, cerca de 2.000 km por rotas com desvios
#
# Com esses valores, de A até E o caminho direto por sw1 tem 1 salto e 30 ms de RTT, e o
# caminho por B tem 2 saltos e 8 ms. RIP e OSPF escolhem o primeiro; quem mede atraso, o segundo.
#
# prefixo    atraso_ms
10.0.10.     1
10.0.20.     15
10.0.25.     3
10.0.34.     5
